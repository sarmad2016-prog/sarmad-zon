<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="مكتبتي الرقمية: جميع البرامج والادوات التي تحتاجها في مكان واحد">
<meta name="theme-color" content="#0d3f29">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../zone-icon.svg">
<title>مكتبتي الرقمية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --green-900: #0d3f29;   /* أيقونة التطبيق + العناوين */
    --green-700: #1d5a40;   /* بطاقة رئيسية */
    --green-500: #2f7a5c;   /* نهاية التدرج */
    --green-100: #dcebe4;
    --mist:      #e3ecea;   /* خلفية الصفحة */
    --sky:       #eaf6fc;   /* بطاقة فاتحة */
    --ink:       #12352a;
    --muted:     #59656d;
    --line:      #cfdcd8;
    --radius-lg: 24px;
    --radius-md: 16px;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #e8f0ee 0%, #dde8e6 55%, #e6eff3 100%);
    background-attachment: fixed;
}

header {
    position: relative;
    text-align: center;
    padding: 56px 20px 30px;
}

.logo {
    display: block;
    width: auto;
    height: 120px;
    margin: 0 auto 18px;
}


h1 {
    margin: 0;
    font-size: 36px;
    font-weight: 800;
    color: var(--green-900);
}

.subtitle {
    margin: 12px auto 0;
    max-width: 30ch;
    font-size: 18px;
    line-height: 1.7;
    color: var(--muted);
}

.container {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px;
}

.section-title {
    margin: 10px 0 18px;
    font-size: 20px;
    font-weight: 700;
    color: var(--green-900);
}

.apps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

/* ---------- بطاقة البرنامج ---------- */
.app {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 24px;
    border-radius: var(--radius-lg);
    text-decoration: none;
    color: inherit;
    background: rgba(255, 255, 255, .8);
    border: 1px solid var(--line);
    box-shadow: 0 6px 20px rgba(13, 63, 41, .06);
    transition: transform .2s, box-shadow .2s;
}

.app:hover,
.app:focus-visible {
    transform: translateY(-4px);
    box-shadow: 0 14px 30px rgba(13, 63, 41, .14);
}

.app-icon {
    width: 56px;
    height: 56px;
    margin-bottom: 14px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    font-size: 28px;
    background: var(--green-100);
}

.app h3 { margin: 0; font-size: 20px; font-weight: 700; }

.app p {
    margin: 0 0 18px;
    font-size: 15px;
    line-height: 1.8;
    color: var(--muted);
}

.open {
    margin-top: auto;
    align-self: stretch;
    padding: 12px;
    border-radius: 14px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: var(--green-900);
    background: var(--green-100);
}

/* البرنامج المميز: بنفس أسلوب بطاقة "إنشاء الأسئلة" في الصورة */
.app.featured {
    color: #fff;
    border-color: rgba(255, 255, 255, .25);
    background: linear-gradient(145deg, var(--green-700), var(--green-500));
    box-shadow: 0 12px 30px rgba(13, 63, 41, .3);
}
.app.featured .app-icon { background: rgba(255, 255, 255, .18); }
.app.featured p { color: rgba(255, 255, 255, .85); }
.app.featured .open { background: #fff; color: var(--green-900); }

/* مكان للبرامج القادمة */
.soon {
    display: grid;
    place-items: center;
    min-height: 200px;
    border-radius: var(--radius-lg);
    border: 2px dashed var(--line);
    color: var(--muted);
    font-size: 15px;
    text-align: center;
    padding: 20px;
}

/* ---------- من نحن ---------- */
.about {
    margin-top: 28px;
    padding: 26px 24px;
    border-radius: var(--radius-lg);
    text-align: center;
    background: linear-gradient(180deg, #f4fbff, var(--sky));
    border: 1px solid #d6e8f1;
    box-shadow: 0 6px 20px rgba(13, 63, 41, .06);
}

.about-icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 12px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    background: #7b8794;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
}

.about h2 { margin: 0 0 6px; font-size: 20px; color: var(--green-900); }
.about p  { margin: 0 auto; max-width: 48ch; line-height: 1.9; color: var(--muted); }

footer {
    text-align: center;
    padding: 40px 15px 28px;
    font-size: 13px;
    color: #7a8791;
}

:focus-visible { outline: 3px solid var(--green-500); outline-offset: 3px; }

@media (max-width: 480px) {
    h1 { font-size: 30px; }
    header { padding-top: 40px; }
}

@media (prefers-reduced-motion: reduce) {
    .app { transition: none; }
    .app:hover, .app:focus-visible { transform: none; }
}

/* تحسين عرض المكتبة على الهواتف */
@media (max-width: 520px) {
    header { padding: 22px 12px 12px; }
    .logo { height: 76px; margin-bottom: 8px; }
    h1 { font-size: 26px; }
    .subtitle { margin-top: 5px; font-size: 14px; line-height: 1.5; }
    .container { padding: 10px 12px; }
    .section-title { margin: 5px 0 10px; font-size: 17px; }
    .apps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .app { padding: 12px 10px; gap: 5px; border-radius: 15px; }
    .app-icon { width: 40px; height: 40px; margin-bottom: 5px; border-radius: 12px; font-size: 22px; }
    .app h3 { font-size: 15px; line-height: 1.4; }
    .app p { margin: 0 0 7px; font-size: 12px; line-height: 1.5; }
    .open { padding: 8px 5px; border-radius: 10px; font-size: 12px; }
    .soon { min-height: 112px; padding: 10px; border-radius: 15px; font-size: 12px; }
    .about { margin-top: 16px; padding: 16px 12px; }
    .about h2 { font-size: 17px; }
    .about p { font-size: 13px; line-height: 1.6; }
    footer { padding: 22px 10px 16px; }
}
@media (max-width: 350px) {
    .apps { grid-template-columns: 1fr; }
}

</style>
</head>

<main class="container">
    <h2 class="section-title">برامجي</h2>
    <div class="apps" id="apps"></div>

    <section class="about">
        <div class="about-icon" aria-hidden="true">i</div>
        <h2>عن المكتبة</h2>
        <p>مجموعة برامج وأدوات صغيرة تحتاجها لتسهيل الأعمال اليومية، وكلها مجانية وتفتح من المتصفح مباشرة.</p>
    </section>
</main>

<footer>sarmad مكتبتي الرقمية ©  2026</footer>

<script>
/* لإضافة برنامج جديد: انسخ سطراً واحداً وعدّل بياناته.
   featured: true  → بطاقة خضراء مميزة */
const apps = [
    {
        icon: "📄",
        title: "منشئ السيرة الذاتية",
        desc: "إنشاء وتصميم السير الذاتية بطريقة سهلة ومنظمة.",
        href: "../cv/",
        featured: true
    },
    {
        icon: "🎮",
        title: "ساحة الألعاب",
        desc: "مجموعة ألعاب للتسلية واللعب مباشرة.",
        href: "../games/"
    }
    // { icon: "🧮", title: "اسم البرنامج", desc: "وصف قصير.", href: "../app2/" },
];
const list = document.getElementById("apps");

apps.forEach(app => {
    const a = document.createElement("a");
    a.className = "app" + (app.featured ? " featured" : "");
    a.href = app.href;

    const icon = document.createElement("div");
    icon.className = "app-icon";
    icon.textContent = app.icon;

    const title = document.createElement("h3");
    title.textContent = app.title;

    const desc = document.createElement("p");
    desc.textContent = app.desc;

    const open = document.createElement("span");
    open.className = "open";
    open.textContent = "فتح البرنامج";

    a.append(icon, title, desc, open);
    list.appendChild(a);
});

const soon = document.createElement("div");
soon.className = "soon";
soon.textContent = "برامج جديدة قريباً";
list.appendChild(soon);
</script>
