<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#102c25">
<title>لعبة المكعبات | sarmad</title>
<style>
:root{color-scheme:dark;--bg:#10251f;--panel:#18382e;--green:#29a36a;--gold:#e6b94f;--txt:#f4f7f2}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#285542,#0b1915 70%);color:var(--txt)}body{ -webkit-user-select:none; user-select:none; }
body{padding:12px}.wrap{width:min(100%,560px);margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.head h1{font-size:clamp(19px,5vw,25px);margin:0;color:var(--gold)}.back{border:1px solid #ffffff30;background:#ffffff12;color:white;border-radius:10px;padding:9px 12px;font-weight:bold}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:10px;align-items:start}.board{background:#08130f;border:3px solid #3a7558;border-radius:13px;padding:5px;box-shadow:0 8px 25px #0006}canvas{display:block;width:100%;height:auto;touch-action:none}.side{display:grid;gap:9px}.panel{background:linear-gradient(145deg,#204b39,#153328);border:1px solid #ffffff20;border-radius:12px;padding:10px;text-align:center}.label{font-size:12px;color:#c8d9cd}.value{font-size:23px;font-weight:900;color:var(--gold);margin-top:3px}.next{width:100%;max-width:100px;margin:6px auto 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button,.pad button{border:0;border-radius:11px;padding:12px 8px;background:linear-gradient(145deg,#2caa70,#18754b);color:white;font-weight:800;font-size:14px;box-shadow:0 3px 0 #0b4b30}.actions .gold{background:linear-gradient(145deg,#f1ca68,#c28b22);color:#241b08;box-shadow:0 3px 0 #805814}.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.pad button{font-size:20px;padding:12px 4px;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.help{text-align:center;color:#c4d5ca;font-size:12px;line-height:1.8;margin:12px 0 4px}.footer{text-align:center;color:#d8c58e;font-size:12px;margin-top:15px}
@media(max-width:390px){body{padding:8px}.layout{grid-template-columns:minmax(0,1fr) 94px;gap:7px}.panel{padding:8px}.value{font-size:20px}.actions button{font-size:12px;padding:11px 5px}}
@media(min-width:500px){.layout{grid-template-columns:300px 1fr}.side{grid-template-columns:1fr 1fr}.nextPanel{grid-column:1/-1}.next{max-width:90px}}
</style>
</head>
<body>
<main class="wrap">
<header class="head"><h1>🧱 لعبة المكعبات</h1><button class="back" id="back">رجوع للألعاب</button></header>
<div class="layout">
<div class="board"><canvas id="game" width="300" height="600" aria-label="لوحة لعبة المكعبات"></canvas></div>
<aside class="side">
<div class="panel"><div class="label">النقاط</div><div class="value" id="score">0</div></div>
<div class="panel"><div class="label">أفضل نتيجة</div><div class="value" id="best">0</div></div>
<div class="panel"><div class="label">المستوى</div><div class="value" id="level">1</div></div>
<div class="panel nextPanel"><div class="label">المكعب القادم</div><canvas class="next" id="next" width="120" height="120"></canvas></div>
</aside>
</div>
<div class="actions"><button id="start">ابدأ اللعبة</button><button class="gold" id="pause">إيقاف مؤقت</button><button class="gold" id="restart">إعادة اللعب</button><button id="sound">🔊 الصوت</button></div>
<div class="pad" aria-label="أزرار التحكم"><button data-act="left">◀</button><button data-act="down">▼</button><button data-act="right">▶</button><button data-act="rotate">⟳</button></div>
<p class="help">حرّك المكعبات حتى تكمل صفاً كاملاً لإزالته. استخدم الأسهم أو أزرار اللمس، والسهم للأعلى لتدوير المكعب.</p>
<footer class="footer">حقوق النشر والتعديل sarmad</footer>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),nextCanvas=document.getElementById('next'),nctx=nextCanvas.getContext('2d');
const COLS=10,ROWS=20,S=30,colors=['','#42c987','#e6b94f','#55a6e8','#df70b0','#e87852','#9b83e8','#b6d65b'];
const shapes=[[[1,1,1,1]],[[2,0,0],[2,2,2]],[[0,0,3],[3,3,3]],[[4,4],[4,4]],[[0,5,5],[5,5,0]],[[0,6,0],[6,6,6]],[[7,7,0],[0,7,7]]];
let board,piece,next,score,level,lines,best=Number(localStorage.getItem('sarmad_tetris_best')||0),running=false,paused=false,ended=false,last=0,acc=0,raf=0;
const $=id=>document.getElementById(id);$('best').textContent=best;
function clone(m){return m.map(r=>r.slice())}function random(){return clone(shapes[Math.floor(Math.random()*shapes.length)])}
function newPiece(){const m=next||random();next=random();piece={m,x:Math.floor(COLS/2)-Math.ceil(m[0].length/2),y:0};drawNext();if(collide(piece.m,piece.x,piece.y)){ended=true;running=false;overlay('انتهت اللعبة');}}
function reset(){board=Array.from({length:ROWS},()=>Array(COLS).fill(0));score=0;level=1;lines=0;ended=false;paused=false;running=false;next=random();newPiece();update();draw();overlay('اضغط ابدأ اللعبة');}
function collide(m,x,y){for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c]){let nx=x+c,ny=y+r;if(nx<0||nx>=COLS||ny>=ROWS||(ny>=0&&board[ny][nx]))return true;}return false;}
function merge(){piece.m.forEach((row,r)=>row.forEach((v,c)=>{if(v&&piece.y+r>=0)board[piece.y+r][piece.x+c]=v;}));let count=0;for(let y=ROWS-1;y>=0;y--)if(board[y].every(Boolean)){board.splice(y,1);board.unshift(Array(COLS).fill(0));count++;y++;}if(count){lines+=count;score+=[0,100,300,500,800][count]*level;level=1+Math.floor(lines/10);if(score>best){best=score;localStorage.setItem('sarmad_tetris_best',best);}}newPiece();update();}
function move(dx,dy){if(!running||paused||ended)return;if(!collide(piece.m,piece.x+dx,piece.y+dy)){piece.x+=dx;piece.y+=dy;draw();}else if(dy>0){merge();draw();}}
function rotate(){if(!running||paused||ended)return;const m=piece.m[0].map((_,i)=>piece.m.map(row=>row[i]).reverse());let offset=0;while(collide(m,piece.x+offset,piece.y)){offset=offset>0?-(offset+1):-offset+1;if(Math.abs(offset)>piece.m[0].length) return;}piece.m=m;piece.x+=offset;draw();}
function update(){ $('score').textContent=score;$('best').textContent=best;$('level').textContent=level;}
function cell(c,r,v,context=ctx,size=S){if(!v)return;context.fillStyle=colors[v];context.fillRect(c*size+1,r*size+1,size-2,size-2);context.fillStyle='#ffffff35';context.fillRect(c*size+3,r*size+3,size-6,3);context.strokeStyle='#07150f88';context.strokeRect(c*size+1,r*size+1,size-2,size-2);}
function draw(){ctx.fillStyle='#08130f';ctx.fillRect(0,0,300,600);ctx.strokeStyle='#ffffff0d';for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,600);ctx.stroke();}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(300,y*S);ctx.stroke();}board.forEach((row,y)=>row.forEach((v,x)=>cell(x,y,v)));if(piece)piece.m.forEach((row,r)=>row.forEach((v,c)=>cell(piece.x+c,piece.y+r,v)));if(!running||paused||ended)overlay(ended?'انتهت اللعبة':paused?'متوقف مؤقتاً':'اضغط ابدأ اللعبة');}
function overlay(msg){drawBaseOnly();ctx.fillStyle='#0009';ctx.fillRect(0,230,300,140);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 21px Tahoma';ctx.fillText(msg,150,300);ctx.font='14px Tahoma';ctx.fillText(ended?'اضغط إعادة اللعب': 'استعد للتحدي',150,330);}
function drawBaseOnly(){ctx.fillStyle='#08130f';ctx.fillRect(0,0,300,600);board?.forEach((row,y)=>row.forEach((v,x)=>cell(x,y,v)));}
function drawNext(){nctx.clearRect(0,0,120,120);if(!next)return;let w=next[0].length,h=next.length,size=22,ox=(120-w*size)/2,oy=(120-h*size)/2;next.forEach((row,r)=>row.forEach((v,c)=>{if(v){nctx.fillStyle=colors[v];nctx.fillRect(ox+c*size+1,oy+r*size+1,size-2,size-2);}}));}
function loop(t){if(!running)return;let dt=t-last;last=t;if(!paused&&!ended){acc+=dt;let speed=Math.max(90,700-(level-1)*55);if(acc>speed){move(0,1);acc=0;}}raf=requestAnimationFrame(loop);}
function start(){if(ended)reset();paused=false;running=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);draw();}
function togglePause(){if(!running&&!paused)return;paused=!paused;if(paused){running=false;cancelAnimationFrame(raf);}else{running=true;last=performance.now();raf=requestAnimationFrame(loop);}draw();}
function action(a){if(a==='left')move(-1,0);if(a==='right')move(1,0);if(a==='down')move(0,1);if(a==='rotate')rotate();}
['contextmenu','copy','cut','paste','selectstart','dragstart'].forEach(type=>document.addEventListener(type,e=>e.preventDefault()));\ndocument.addEventListener('keydown',e=>{const map={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'rotate',' ':'rotate'};if(map[e.key]){e.preventDefault();action(map[e.key]);}if(e.key==='Enter'&&!running)start();if(e.key==='Escape')togglePause();});
document.querySelectorAll('[data-act]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();action(b.dataset.act);});});
$('start').onclick=start;$('pause').onclick=togglePause;$('restart').onclick=reset;$('sound').onclick=()=>{$('sound').textContent=$('sound').textContent.includes('🔊')?'🔇 صامت':'🔊 الصوت';};
$('back').onclick=()=>{if(window.parent&&window.parent!==window&&window.parent.__goHub)window.parent.__goHub();else history.back();};
let touchX=0,touchY=0;canvas.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;},{passive:true});canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.max(Math.abs(dx),Math.abs(dy))<18)rotate();else if(Math.abs(dx)>Math.abs(dy))action(dx>0?'left':'right');else action(dy>0?'down':'rotate');},{passive:true});
reset();
})();
</script>
</body>
</html>
